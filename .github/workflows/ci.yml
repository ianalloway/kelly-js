name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee npm-install.log

      - name: Upload npm install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-log
          path: npm-install.log

      - name: Build
        run: npm run build

      - name: Type check (src + tests)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify exports
        run: node -e "const k = require('./dist/index.js'); console.log('kelly(-110, 0.58):', k.kelly(0.58, -110).fraction); console.log('clv:', k.clv(-108, -115).verdict);"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
