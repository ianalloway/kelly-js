name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check (src + tests)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx tsc

      - name: Verify exports
        run: node -e "const k = require('./dist/index.js'); console.log('kelly(-110, 0.58):', k.kelly(0.58, -110).fraction); console.log('clv:', k.clv(-108, -115).verdict);"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npx tsc
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
