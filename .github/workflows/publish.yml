name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Publish with provenance
        id: npm_publish
        run: npm publish --provenance --access public

      - name: Explain publish auth failures
        if: failure() && steps.npm_publish.outcome == 'failure'
        run: |
          echo "::error::Publish failed. Check npmjs.com package Settings, Trusted Publisher, GitHub Actions:"
          echo "::error::  repo ianalloway/kelly-js, workflow file publish.yml"
